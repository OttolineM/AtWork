workflows:
  atwork-android:
    name: AtWork Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      vars:
        SUPABASE_URL: "https://omrlpjefpjmxoyyltuou.supabase.co"
        SUPABASE_ANON_KEY: "sb_publishable_0pUziBECljFnmerPMr9PQQ_UUwhvIIGsb_publishable_0pUziBECljFnmerPMr9PQQ_UUwhvIIGsb_publishable_0pUziBECljFnmerPMr9PQQ_UUwhvIIGsb_publishable_0pUziBECljFnmerPMr9PQQ_UUwhvIIGsb_publishable_0pUziBECljFnmerPMr9PQQ_UUwhvIIG"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get

      - name: Build AtWork Android APK
        script: |
          cd app
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

    artifacts:
      - app/build/app/outputs/flutter-apk/app-release.apk
